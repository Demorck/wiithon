# Called by CI
name: docs
on: workflow_call

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        if: ${{ !env.ACT }} # For local testing workflow
        with:
          python-version: '3.12'

      - name: Setup venv
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Install deps
        run: pip install -e ".[docs]"

      - name: Check generated api pages are in sync
        run: python docs/regen_api.py --check

      - name: Build documentation
        run: sphinx-build -W --keep-going -b html docs/sphinx/source docs/sphinx/build/html

      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/sphinx/build/html